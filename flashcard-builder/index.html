<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Builder — LEARN Tools</title>
<style>
  :root {
    --jade: #487A7B;
    --ink: #1a1a1a;
    --paper: #ffffff;
    --panel: #f6f6f4;
    --line: #d8d8d4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Source Sans 3', Arial, sans-serif;
    color: var(--ink);
    background: var(--panel);
    margin: 0;
    line-height: 1.5;
  }
  header {
    background: var(--jade);
    color: #fff;
    padding: 22px 28px;
  }
  header h1 { font-family: 'Crimson Pro', Georgia, serif; margin: 0 0 4px; font-size: 1.6em; }
  header p { margin: 0; opacity: 0.9; font-size: 0.95em; }

  .wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding: 24px;
    max-width: 1300px;
    margin: 0 auto;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 18px; }
  .card h2 { font-family: 'Crimson Pro', Georgia, serif; margin: 0 0 12px; font-size: 1.25em; border-bottom: 2px solid var(--jade); padding-bottom: 6px; }
  label { display: block; font-weight: 600; font-size: 0.85em; margin-bottom: 4px; }
  select, input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; font-family: inherit; font-size: 0.95em; margin-bottom: 12px; }

  .theme-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .swatch { width: 34px; height: 34px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .swatch.active { border-color: var(--ink); }
  .swatch-name { font-size: 0.7em; text-align: center; margin-top: 2px; color: #555; }

  .item-block { border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 12px; background: #fafafa; }
  .item-block .item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .item-block .item-head strong { font-size: 0.85em; color: #666; }
  .remove-btn { background: none; border: none; color: #a50034; cursor: pointer; font-size: 0.85em; font-weight: 600; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .toolbar button { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; cursor: pointer; font-size: 0.95em; min-width: 32px; text-align: center; }
  .toolbar button:hover { background: #eee; }
  .toolbar button.active { background: var(--jade); color: #fff; border-color: var(--jade); }

  .rte { border: 1px solid var(--line); border-radius: 5px; min-height: 60px; padding: 8px 10px; background: #fff; font-size: 0.9em; }
  .rte:focus { outline: 2px solid var(--jade); outline-offset: 1px; }
  .rte h3, .rte h4 { font-family: 'Crimson Pro', Georgia, serif; margin: 4px 0; }
  .rte:empty:before { content: attr(data-placeholder); color: #999; pointer-events: none; }

  .char-count { font-size: 0.78em; color: #777; margin-top: 4px; }
  .char-count.warn { color: #a50034; font-weight: 600; }

  .add-btn, .action-btn { background: var(--jade); color: #fff; border: none; border-radius: 6px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 0.95em; }
  .add-btn { width: 100%; }
  .add-btn:hover, .action-btn:hover { background: #355a5b; }
  .action-btn.secondary { background: #555; }
  .action-btn.secondary:hover { background: #333; }
  .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

  #codeOut { width: 100%; height: 220px; font-family: 'Courier New', monospace; font-size: 0.8em; padding: 10px; border: 1px solid var(--line); border-radius: 5px; resize: vertical; }
  .copied-msg { color: #154734; font-weight: 600; font-size: 0.85em; margin-top: 6px; display: none; }
  .copied-msg.show { display: inline; }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 100; }
  .modal-backdrop.show { display: flex; }
  .modal-box { background: #fff; border-radius: 8px; padding: 20px; width: 100%; max-width: 380px; }
  .modal-box h3 { font-family: 'Crimson Pro', Georgia, serif; margin: 0 0 12px; }
  .modal-box label { margin-top: 8px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-actions button { padding: 8px 14px; border-radius: 5px; border: 1px solid var(--line); cursor: pointer; font-weight: 600; }
  .modal-actions .primary { background: var(--jade); color: #fff; border-color: var(--jade); }

  /* live preview flashcards */
  #previewRoot { display: flex; flex-wrap: wrap; gap: 14px; }
  #previewRoot .lt-fc-card { width: 200px; height: 140px; perspective: 1000px; }
  #previewRoot .lt-fc-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; cursor: pointer; }
  #previewRoot .lt-fc-card.flipped .lt-fc-inner { transform: rotateY(180deg); }
  #previewRoot .lt-fc-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-sizing: border-box; overflow-y: auto; }
  #previewRoot .lt-fc-front { background: var(--fc-base, var(--jade)); color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-weight: 600; }
  #previewRoot .lt-fc-back { background: #fff; color: #1a1a1a; transform: rotateY(180deg); padding: 12px; text-align: left; border: 1px solid var(--fc-base, var(--jade)); }
  #previewRoot .lt-fc-back a { color: var(--fc-base, var(--jade)); font-weight: 600; }
  #previewRoot .lt-fc-back ul, #previewRoot .lt-fc-back ol { margin: 0 0 8px 20px; padding: 0; }
  #previewRoot .lt-fc-back p { margin: 0 0 8px; }
  #previewRoot .lt-fc-hint { width: 100%; font-size: 0.72em; color: #888; text-align: center; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>Flashcard Builder</h1>
  <p>Build a themed set of flip cards, then copy the code into an Ultra HTML block — or download a plain handout version.</p>
</header>

<div class="wrap">

  <!-- LEFT: CONTROLS -->
  <div>
    <div class="card">
      <h2>1. Colour theme</h2>
      <div class="theme-swatches" id="swatches"></div>
    </div>

    <div class="card">
      <h2>2. Cards</h2>
      <div id="itemsContainer"></div>
      <button class="add-btn" id="addItemBtn">+ Add card</button>
    </div>

    <div class="card">
      <h2>3. Get your content</h2>
      <div class="action-row">
        <button class="action-btn" id="generateBtn">Generate HTML for Ultra</button>
        <button class="action-btn secondary" id="downloadDocBtn">Download handout (.doc)</button>
      </div>
      <div style="margin-top:14px;">
        <label for="codeOut">Copy this into an Ultra HTML block</label>
        <textarea id="codeOut" readonly placeholder="Click &quot;Generate HTML for Ultra&quot; above once your cards are ready."></textarea>
        <div>
          <button class="action-btn" id="copyBtn" style="margin-top:8px;">Copy to clipboard</button>
          <span class="copied-msg" id="copiedMsg">Copied!</span>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT: PREVIEW -->
  <div>
    <div class="card">
      <h2>Live preview <span style="font-weight:400; font-size:0.7em; color:#777;">(click a card to flip it)</span></h2>
      <div id="previewRoot"></div>
    </div>
  </div>

</div>

<div class="modal-backdrop" id="linkModal">
  <div class="modal-box">
    <h3>Insert link</h3>
    <label for="linkTextInput">Text to display</label>
    <input type="text" id="linkTextInput" placeholder="e.g. library referencing guide">
    <label for="linkUrlInput">Link URL</label>
    <input type="text" id="linkUrlInput" placeholder="https://">
    <div class="modal-actions">
      <button type="button" id="linkCancelBtn">Cancel</button>
      <button type="button" class="primary" id="linkInsertBtn">Insert link</button>
    </div>
  </div>
</div>

<script>
// ---------- Palette ----------
const PALETTE = [
  { key: 'blue-bright', name: 'Bright blue', base: '#007288', hover: '#004755' },
  { key: 'blue-muted', name: 'Muted blue', base: '#004f71', hover: '#002b3e' },
  { key: 'blue-university', name: 'University blue', base: '#041E42', hover: '#010812' },
  { key: 'brown', name: 'Brown', base: '#6d4f47', hover: '#4e3933' },
  { key: 'burgundy', name: 'Burgundy', base: '#a50034', hover: '#720024' },
  { key: 'green-dark', name: 'Green dark', base: '#154734', hover: '#092017' },
  { key: 'grey', name: 'Grey', base: '#333f48', hover: '#1e252a' },
  { key: 'jade', name: 'Jade', base: '#487A7B', hover: '#355a5b' },
  { key: 'pink', name: 'Pink', base: '#D0006F', hover: '#9d0054' },
  { key: 'purple', name: 'Purple', base: '#830065', hover: '#50003e' },
  { key: 'red', name: 'Red', base: '#d50032', hover: '#a20026' }
];
let currentTheme = PALETTE.find(p => p.key === 'jade');
const CHAR_SOFT_LIMIT = 200;

// ---------- Link modal ----------
const linkModal = document.getElementById('linkModal');
const linkTextInput = document.getElementById('linkTextInput');
const linkUrlInput = document.getElementById('linkUrlInput');
let linkModalResolve = null;

function openLinkModal(prefillText) {
  linkTextInput.value = prefillText || '';
  linkUrlInput.value = 'https://';
  linkModal.classList.add('show');
  (prefillText ? linkUrlInput : linkTextInput).focus();
  return new Promise(resolve => { linkModalResolve = resolve; });
}
function closeLinkModal(result) {
  linkModal.classList.remove('show');
  if (linkModalResolve) { linkModalResolve(result); linkModalResolve = null; }
}
document.getElementById('linkInsertBtn').addEventListener('click', () => {
  const text = linkTextInput.value.trim();
  const url = linkUrlInput.value.trim();
  if (!text || !url) return;
  closeLinkModal({ text, url });
});
document.getElementById('linkCancelBtn').addEventListener('click', () => closeLinkModal(null));
linkModal.addEventListener('click', (e) => { if (e.target === linkModal) closeLinkModal(null); });
[linkTextInput, linkUrlInput].forEach(el => el.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('linkInsertBtn').click(); }
  if (e.key === 'Escape') closeLinkModal(null);
}));

// ---------- State ----------
let items = [];
let itemCounter = 0;
function makeItem(front) { itemCounter++; return { id: 'itm' + itemCounter, front: front || '', backHtml: '' }; }
items.push(makeItem('Plagiarism'));

// ---------- Swatches ----------
const swatchesEl = document.getElementById('swatches');
PALETTE.forEach(p => {
  const wrap = document.createElement('div');
  wrap.style.textAlign = 'center';
  const sw = document.createElement('div');
  sw.className = 'swatch' + (p.key === currentTheme.key ? ' active' : '');
  sw.style.background = p.base;
  sw.title = p.name;
  sw.addEventListener('click', () => {
    currentTheme = p;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    renderPreview();
  });
  const label = document.createElement('div');
  label.className = 'swatch-name';
  label.textContent = p.name;
  wrap.appendChild(sw);
  wrap.appendChild(label);
  swatchesEl.appendChild(wrap);
});

// ---------- Item editor rendering ----------
const itemsContainer = document.getElementById('itemsContainer');

function updateToolbarState(toolbar, toolButtons) {
  toolButtons.forEach(btn => {
    const cmd = btn.dataset.command;
    if (!cmd) { btn.classList.remove('active'); return; }
    let isActive = false;
    if (cmd === 'formatBlock:h4' || cmd === 'formatBlock:p') {
      const current = (document.queryCommandValue('formatBlock') || '').toLowerCase();
      isActive = cmd === 'formatBlock:' + current;
    } else {
      try { isActive = document.queryCommandState(cmd); } catch (e) { isActive = false; }
    }
    btn.classList.toggle('active', isActive);
  });
}

function renderItems() {
  itemsContainer.innerHTML = '';
  items.forEach((item, idx) => {
    const block = document.createElement('div');
    block.className = 'item-block';

    const head = document.createElement('div');
    head.className = 'item-head';
    head.innerHTML = `<strong>Card ${idx + 1}</strong>`;
    if (items.length > 1) {
      const rm = document.createElement('button');
      rm.className = 'remove-btn';
      rm.textContent = 'Remove';
      rm.addEventListener('click', () => { items.splice(idx, 1); renderItems(); renderPreview(); });
      head.appendChild(rm);
    }
    block.appendChild(head);

    const frontLabel = document.createElement('label');
    frontLabel.textContent = 'Front of card (short label)';
    block.appendChild(frontLabel);
    const frontInput = document.createElement('input');
    frontInput.type = 'text';
    frontInput.value = item.front;
    frontInput.addEventListener('input', () => { item.front = frontInput.value; renderPreview(); });
    block.appendChild(frontInput);

    const backLabel = document.createElement('label');
    backLabel.textContent = 'Back of card';
    block.appendChild(backLabel);

    const toolbar = document.createElement('div');
    toolbar.className = 'toolbar';
    const tools = [
      ['<strong>B</strong>', 'Bold', 'bold', () => document.execCommand('bold')],
      ['<em>I</em>', 'Italic', 'italic', () => document.execCommand('italic')],
      ['•', 'Bulleted list', 'insertUnorderedList', () => document.execCommand('insertUnorderedList')],
      ['1.', 'Numbered list', 'insertOrderedList', () => document.execCommand('insertOrderedList')],
      ['🔗', 'Insert link', null, () => insertLink()]
    ];
    const toolButtons = [];
    tools.forEach(([glyph, tooltip, cmd, fn]) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.innerHTML = glyph;
      btn.title = tooltip;
      btn.setAttribute('aria-label', tooltip);
      if (cmd) btn.dataset.command = cmd;
      btn.addEventListener('mousedown', (e) => {
        e.preventDefault(); rte.focus(); fn(); item.backHtml = rte.innerHTML; renderPreview(); updateCharCount();
        updateToolbarState(toolbar, toolButtons);
      });
      toolbar.appendChild(btn);
      toolButtons.push(btn);
    });
    block.appendChild(toolbar);

    const rte = document.createElement('div');
    rte.className = 'rte';
    rte.contentEditable = 'true';
    rte.setAttribute('data-placeholder', 'Type the back of the card here…');
    rte.innerHTML = item.backHtml || '';

    const charCount = document.createElement('div');
    charCount.className = 'char-count';

    function updateCharCount() {
      const len = rte.textContent.trim().length;
      charCount.textContent = len + ' characters (aim for roughly 2–3 sentences, under ' + CHAR_SOFT_LIMIT + ')';
      charCount.classList.toggle('warn', len > CHAR_SOFT_LIMIT);
    }
    updateCharCount();

    rte.addEventListener('input', () => { item.backHtml = rte.innerHTML; renderPreview(); updateCharCount(); });
    rte.addEventListener('keyup', () => updateToolbarState(toolbar, toolButtons));
    rte.addEventListener('mouseup', () => updateToolbarState(toolbar, toolButtons));
    rte.addEventListener('focus', () => updateToolbarState(toolbar, toolButtons));

    function insertLink() {
      const selectedText = window.getSelection().toString();
      openLinkModal(selectedText).then(result => {
        if (!result) return;
        rte.focus();
        const safeText = result.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const safeUrl = result.url.replace(/"/g,'&quot;');
        document.execCommand('insertHTML', false, `<a href="${safeUrl}">${safeText}</a>`);
        item.backHtml = rte.innerHTML;
        renderPreview();
        updateCharCount();
      });
    }

    block.appendChild(rte);
    block.appendChild(charCount);
    itemsContainer.appendChild(block);
  });
}

document.getElementById('addItemBtn').addEventListener('click', () => {
  items.push(makeItem(''));
  renderItems();
  renderPreview();
});

// ---------- Live preview ----------
const previewRoot = document.getElementById('previewRoot');

function renderPreview() {
  previewRoot.style.setProperty('--fc-base', currentTheme.base);
  previewRoot.innerHTML = '';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'lt-fc-card';
    card.innerHTML = `
      <div class="lt-fc-inner">
        <div class="lt-fc-face lt-fc-front">${escapeHtml(item.front) || '(untitled)'}</div>
        <div class="lt-fc-face lt-fc-back">${item.backHtml || '<p><em>Empty</em></p>'}</div>
      </div>`;
    card.addEventListener('click', () => card.classList.toggle('flipped'));
    previewRoot.appendChild(card);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

renderItems();
renderPreview();

// ---------- Generate embed code ----------
function generateHtml() {
  const uid = 'ltfc' + Math.random().toString(36).slice(2, 9);
  const t = currentTheme;
  let cardsHtml = '';
  items.forEach(item => {
    cardsHtml += `
    <div class="lt-fc-card">
      <div class="lt-fc-inner">
        <div class="lt-fc-face lt-fc-front">${escapeHtml(item.front) || 'Untitled'}</div>
        <div class="lt-fc-face lt-fc-back">${item.backHtml || '<p></p>'}</div>
      </div>
    </div>`;
  });

  return `<div class="${uid}">
<style>
.${uid} { display: flex; flex-wrap: wrap; gap: 14px; font-family: 'Source Sans 3', Arial, sans-serif; }
.${uid} .lt-fc-card { width: 200px; height: 140px; perspective: 1000px; cursor: pointer; }
.${uid} .lt-fc-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s; transform-style: preserve-3d; }
.${uid} .lt-fc-card.flipped .lt-fc-inner { transform: rotateY(180deg); }
.${uid} .lt-fc-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; box-sizing: border-box; overflow-y: auto; }
.${uid} .lt-fc-front { background: ${t.base}; color: #ffffff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; font-weight: 600; }
.${uid} .lt-fc-back { background: #fff; color: #1a1a1a; transform: rotateY(180deg); padding: 12px; text-align: left; border: 1px solid ${t.base}; }
.${uid} .lt-fc-back a { color: ${t.base}; font-weight: 600; }
.${uid} .lt-fc-back ul, .${uid} .lt-fc-back ol { margin: 0 0 8px 20px; padding: 0; }
.${uid} .lt-fc-back p { margin: 0 0 8px; }
</style>
${cardsHtml}
</div>
<script>
(function() {
  var root = document.querySelector('.${uid}');
  if (!root) return;
  root.querySelectorAll('.lt-fc-card').forEach(function(card) {
    card.addEventListener('click', function() { card.classList.toggle('flipped'); });
  });
})();
<\/script>`;
}

document.getElementById('generateBtn').addEventListener('click', () => {
  document.getElementById('codeOut').value = generateHtml();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const out = document.getElementById('codeOut');
  if (!out.value) return;
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 1800);
  });
});

// ---------- Word handout export ----------
document.getElementById('downloadDocBtn').addEventListener('click', () => {
  let body = '<h1 style="font-family:Georgia,serif;">Handout</h1>';
  items.forEach((item, idx) => {
    body += `<h2 style="font-family:Georgia,serif;color:${currentTheme.base};">${escapeHtml(item.front) || 'Card ' + (idx + 1)}</h2>`;
    body += item.backHtml || '<p></p>';
  });
  const docHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Handout</title></head>
<body style="font-family:Calibri,Arial,sans-serif;">${body}</body></html>`;
  const blob = new Blob(['\ufeff', docHtml], { type: 'application/msword' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'flashcard-handout.doc';
  link.click();
});
</script>

</body>
</html>
