<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quote Builder — LEARN Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Sans 3', 'Source Sans Pro', Arial, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #830065;
    padding: 0.85rem 1.5rem 1rem;
  }
  .back-link {
    display: inline-block;
    color: rgba(255,255,255,0.85);
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 0.35rem;
  }
  .back-link:hover, .back-link:focus-visible { color: #fff; text-decoration: underline; }
  header h1 {
    font-family: 'Crimson Pro', 'Crimson Text', Georgia, serif;
    color: #fff;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header p {
    color: rgba(255,255,255,0.75);
    font-size: 0.8rem;
    margin-top: 2px;
  }

  .app {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    padding: 1.25rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .panel {
    background: #fff;
    border-radius: 8px;
    padding: 1.25rem;
    border: 1px solid #e0e0e0;
  }

  .panel-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #830065;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid #f0e6ee;
  }

  /* ── Style picker ── */
  .style-grid {
    --q: #830065;
    --q-tint: #f3ebf1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    margin-bottom: 1.1rem;
  }

  .style-card {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    background: #fff;
    border: 2px solid #e0e0e0;
    border-radius: 6px;
    padding: 0.6rem 0.75rem 0.7rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  .style-card:hover { border-color: #830065; background: #fdf5fb; }
  .style-card:focus-visible { outline: 3px solid #007288; outline-offset: 2px; }
  .style-card.active { border-color: #830065; background: #fdf5fb; }
  .style-card.active::after {
    content: '✓';
    position: absolute;
    top: 5px; right: 8px;
    font-size: 10px;
    color: #830065;
    font-weight: 700;
  }

  .style-card-name {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 5px;
  }

  /* Mini previews — all driven by --q / --q-tint on .style-grid */
  .mini { display: block; font-size: 9px; font-style: italic; color: #555; line-height: 1.4; }
  .mini-classic   { border-left: 3px solid var(--q); padding-left: 6px; }
  .mini-sidebar   { border-left: 5px solid var(--q); background: var(--q-tint); padding: 4px 6px; border-radius: 0 2px 2px 0; }
  .mini-toptail   { border-top: 2px solid var(--q); border-bottom: 2px solid var(--q); padding: 4px 2px; text-align: center; }
  .mini-bigquote  { position: relative; padding-left: 16px; }
  .mini-bigquote::before { content: '\201C'; position: absolute; left: 0; top: -2px; font-size: 22px; color: var(--q); line-height: 1; font-style: normal; font-family: Georgia, serif; }
  .mini-colourblock { background: var(--q); color: #fff; padding: 5px 7px; border-radius: 3px; }
  .mini-speech    { position: relative; background: var(--q-tint); border: 1.5px solid var(--q); border-radius: 7px; padding: 4px 7px; margin-bottom: 6px; }
  .mini-speech::after {
    content: ''; position: absolute; left: 10px; bottom: -5px;
    width: 7px; height: 7px; background: var(--q-tint);
    border-right: 1.5px solid var(--q); border-bottom: 1.5px solid var(--q);
    transform: rotate(45deg);
  }

  /* ── Colour picker ── */
  .colour-label {
    font-size: 0.72rem;
    color: #555;
    margin-bottom: 0.5rem;
  }
  .colour-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
    position: relative;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch:focus-visible { outline: 3px solid #007288; outline-offset: 2px; }
  .swatch.active { border-color: #1a1a1a; transform: scale(1.15); }
  .swatch-tooltip {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: #1a1a1a;
    color: #fff;
    font-size: 10px;
    white-space: nowrap;
    padding: 3px 7px;
    border-radius: 4px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }
  .swatch:hover .swatch-tooltip, .swatch:focus-visible .swatch-tooltip { opacity: 1; }

  /* ── Fields ── */
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    color: #555;
    margin-bottom: 5px;
  }
  .field label .opt {
    font-weight: 400;
    color: #aaa;
    margin-left: 4px;
    font-size: 0.68rem;
  }
  .field textarea, .field input[type="text"] {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 0.5rem 0.65rem;
    font-family: inherit;
    font-size: 0.82rem;
    color: #1a1a1a;
    background: #fafafa;
    transition: border-color 0.15s;
    resize: none;
  }
  .field textarea:focus, .field input[type="text"]:focus {
    outline: none;
    border-color: #830065;
    background: #fff;
  }

  /* ── Preview ── */
  .preview-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.5rem;
  }
  .sample-tag {
    font-size: 0.68rem;
    font-weight: 600;
    color: #6a5a66;
    background: #f3ebf1;
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .sample-tag[hidden] { display: none; }
  .preview-area {
    min-height: 100px;
    display: flex;
    align-items: center;
  }
  #live-preview { width: 100%; transition: opacity 0.15s; }
  #live-preview.is-sample { opacity: 0.75; }

  /* ── Generate + output ── */
  .action-btn {
    display: block;
    width: 100%;
    background: #830065;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.7rem 1rem;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .action-btn:hover { background: #6a0052; }
  .action-btn:focus-visible { outline: 3px solid #007288; outline-offset: 2px; }

  .gen-msg {
    font-size: 0.75rem;
    margin: 0.5rem 0 0;
    min-height: 1.1em;
    color: #555;
  }
  .gen-msg.warn { color: #a50034; font-weight: 600; }

  .output-area { position: relative; margin-top: 0.6rem; }
  #html-output {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 0.65rem;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: #333;
    background: #f9f9f9;
    resize: vertical;
    line-height: 1.5;
    transition: opacity 0.15s;
  }
  #html-output.stale { opacity: 0.45; }

  #copy-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: #830065;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 0.7rem;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
  }
  #copy-btn:hover { background: #6a0052; }
  #copy-btn:disabled { background: #ccc; cursor: default; }

  #copy-confirm {
    font-size: 0.72rem;
    color: #2e7d32;
    margin-top: 5px;
    visibility: hidden;
    height: 16px;
  }

  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="../">&larr; Back to all tools</a>
  <h1>Quote Builder</h1>
  <p>Choose a style, pick a colour, fill in your quote — then generate the HTML for Ultra.</p>
</header>

<div class="app">

  <!-- LEFT: Controls -->
  <div>
    <div class="panel" style="margin-bottom:1.25rem;">
      <p class="panel-title">Style</p>
      <div class="style-grid" id="style-grid">
        <button type="button" class="style-card active" data-style="classic" aria-pressed="true">
          <span class="style-card-name">Classic Rule</span>
          <span class="mini mini-classic">The pursuit of knowledge is its own reward.</span>
        </button>
        <button type="button" class="style-card" data-style="sidebar" aria-pressed="false">
          <span class="style-card-name">Sidebar Block</span>
          <span class="mini mini-sidebar">The pursuit of knowledge is its own reward.</span>
        </button>
        <button type="button" class="style-card" data-style="toptail" aria-pressed="false">
          <span class="style-card-name">Top &amp; Tail</span>
          <span class="mini mini-toptail">The pursuit of knowledge is its own reward.</span>
        </button>
        <button type="button" class="style-card" data-style="bigquote" aria-pressed="false">
          <span class="style-card-name">Large Quote Mark</span>
          <span class="mini mini-bigquote">The pursuit of knowledge is its own reward.</span>
        </button>
        <button type="button" class="style-card" data-style="colourblock" aria-pressed="false">
          <span class="style-card-name">Colour Block</span>
          <span class="mini mini-colourblock">The pursuit of knowledge is its own reward.</span>
        </button>
        <button type="button" class="style-card" data-style="speech" aria-pressed="false">
          <span class="style-card-name">Speech Bubble</span>
          <span class="mini mini-speech">The pursuit of knowledge is its own reward.</span>
        </button>
      </div>

      <p class="colour-label">Accent colour</p>
      <div class="colour-swatches" id="colour-swatches"></div>
    </div>

    <div class="panel">
      <p class="panel-title">Content</p>
      <div class="field">
        <label for="quote-text">Quote text</label>
        <textarea id="quote-text" rows="4" placeholder="Enter the quote here..."></textarea>
      </div>
      <div class="field">
        <label for="quote-author">Author</label>
        <input type="text" id="quote-author" placeholder="e.g. Jane Smith, Professor of History" />
      </div>
      <div class="field">
        <label for="quote-ref">Reference <span class="opt">optional</span></label>
        <input type="text" id="quote-ref" placeholder="e.g. Smith, J. (2023). Title of Work. Publisher." />
      </div>
    </div>
  </div>

  <!-- RIGHT: Preview + Output -->
  <div>
    <div class="panel" style="margin-bottom:1.25rem;">
      <div class="preview-head">
        <p class="panel-title" style="flex:1;">Preview</p>
      </div>
      <div class="preview-area">
        <div id="live-preview" aria-live="polite"></div>
      </div>
      <p style="text-align:right;margin-top:0.5rem;"><span class="sample-tag" id="sample-tag">Sample text — start typing to see your quote</span></p>
    </div>

    <div class="panel">
      <p class="panel-title">Get your HTML</p>
      <button type="button" class="action-btn" id="generate-btn">Generate HTML for Ultra</button>
      <p class="gen-msg" id="gen-msg" role="status"></p>
      <div class="output-area">
        <label for="html-output" style="display:block;font-size:0.72rem;font-weight:600;color:#555;margin-bottom:5px;">Copy this into an Ultra HTML block</label>
        <textarea id="html-output" rows="9" readonly placeholder="Click &quot;Generate HTML for Ultra&quot; above once your quote is ready."></textarea>
        <button id="copy-btn" disabled>Copy</button>
      </div>
      <p id="copy-confirm">Copied to clipboard!</p>
    </div>
  </div>

</div>

<script>
  const colours = [
    { name: 'Purple',          hex: '#830065' },
    { name: 'Bright pink',     hex: '#D0006F' },
    { name: 'University red',  hex: '#D50032' },
    { name: 'Burgundy',        hex: '#A50034' },
    { name: 'University blue', hex: '#041E42' },
    { name: 'Muted blue',      hex: '#004F71' },
    { name: 'Bright blue',     hex: '#007288' },
    { name: 'Jade',            hex: '#487A7B' },
    { name: 'Dark green',      hex: '#154734' },
    { name: 'Spruce grey',     hex: '#333F48' },
    { name: 'Muted brown',     hex: '#6D4F47' },
  ];

  // Shown in the preview until the user types a quote (reference is never sampled)
  const SAMPLE = {
    quote:  'The pursuit of knowledge is its own reward.',
    author: 'Jane Smith, Professor of History',
  };

  let currentStyle  = 'classic';
  let currentColour = '#830065';
  let lastGenerated = null;   // the HTML currently in the output box

  const $ = id => document.getElementById(id);

  /* ── Swatches ── */
  const swatchContainer = $('colour-swatches');
  colours.forEach((c, i) => {
    const s = document.createElement('button');
    s.type = 'button';
    s.className = 'swatch' + (i === 0 ? ' active' : '');
    s.style.background = c.hex;
    s.setAttribute('aria-label', c.name);
    s.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    s.innerHTML = `<span class="swatch-tooltip">${c.name}</span>`;
    s.addEventListener('click', () => {
      swatchContainer.querySelectorAll('.swatch').forEach(x => {
        x.classList.remove('active'); x.setAttribute('aria-pressed', 'false');
      });
      s.classList.add('active');
      s.setAttribute('aria-pressed', 'true');
      currentColour = c.hex;
      updateMiniPreviews();
      update();
    });
    swatchContainer.appendChild(s);
  });

  /* ── Style cards ── */
  document.querySelectorAll('.style-card').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.style-card').forEach(x => {
        x.classList.remove('active'); x.setAttribute('aria-pressed', 'false');
      });
      card.classList.add('active');
      card.setAttribute('aria-pressed', 'true');
      currentStyle = card.dataset.style;
      update();
    });
  });

  function updateMiniPreviews() {
    const grid = $('style-grid');
    grid.style.setProperty('--q', currentColour);
    grid.style.setProperty('--q-tint', mixWithWhite(currentColour, 0.08));
  }

  /* ── Helpers ── */
  // Solid hex equivalent of the colour at `amount` opacity over white
  function mixWithWhite(hex, amount) {
    const ch = i => {
      const v = parseInt(hex.slice(i, i + 2), 16);
      return Math.round(255 - (255 - v) * amount).toString(16).padStart(2, '0');
    };
    return '#' + ch(1) + ch(3) + ch(5);
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Escape, and keep any line breaks the user typed in the quote
  function formatQuote(s) {
    return escapeHtml(s).replace(/\r?\n/g, '<br>');
  }

  /* ── Inline styles for each quote style (used for both preview and output) ── */
  function buildInlineStyles() {
    const c    = currentColour;
    const tint = mixWithWhite(c, 0.08);

    const base        = `font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.05rem;line-height:1.6;color:#1a1a1a;margin:0;`;
    const authorStyle = `display:block;font-family:Arial,sans-serif;font-size:0.8rem;color:#555;font-style:normal;margin:0.4rem 0 0;`;
    const refStyle    = `display:block;font-family:Arial,sans-serif;font-size:0.72rem;color:#767676;font-style:italic;margin:0.2rem 0 0;`;

    switch (currentStyle) {
      case 'classic':
        return {
          blockquote: `border-left:4px solid ${c};padding:0.6rem 0 0.6rem 1rem;margin:1rem 0;`,
          text: base, author: authorStyle, ref: refStyle,
        };
      case 'sidebar':
        return {
          blockquote: `border-left:6px solid ${c};background:${tint};padding:0.75rem 1rem;border-radius:0 4px 4px 0;margin:1rem 0;`,
          text: base, author: authorStyle, ref: refStyle,
        };
      case 'toptail':
        return {
          blockquote: `border-top:2px solid ${c};border-bottom:2px solid ${c};padding:0.75rem 0.25rem;text-align:center;margin:1rem 0;`,
          text: base,
          author: authorStyle + 'text-align:center;',
          ref:    refStyle + 'text-align:center;',
        };
      case 'bigquote':
        return {
          blockquote: `position:relative;padding:0.25rem 0 0.25rem 2.5rem;margin:1rem 0;`,
          openmark:   `<span aria-hidden="true" style="position:absolute;left:0;top:-0.35rem;font-size:3.5rem;color:${c};line-height:1;font-family:Georgia,serif;font-style:normal;">&#x201C;</span>`,
          text: base, author: authorStyle, ref: refStyle,
        };
      case 'colourblock':
        // All 11 brand colours pass WCAG AA with white text
        return {
          blockquote: `background:${c};padding:1.1rem 1.4rem;border-radius:6px;margin:1rem 0;`,
          text:   base.replace('color:#1a1a1a;', 'color:#ffffff;'),
          author: authorStyle.replace('color:#555;', 'color:#ffffff;'),
          ref:    refStyle.replace('color:#767676;', 'color:#ffffff;'),
        };
      case 'speech':
        return {
          blockquote: `margin:1rem 0;`,
          bubble:     `position:relative;background:${tint};border:2px solid ${c};border-radius:12px;padding:0.85rem 1.1rem;margin:0 0 0.9rem;`,
          tail:       `<span aria-hidden="true" style="position:absolute;left:1.6rem;bottom:-9px;width:16px;height:16px;background:${tint};border-right:2px solid ${c};border-bottom:2px solid ${c};transform:rotate(45deg);"></span>`,
          text:   base,
          author: authorStyle + 'padding-left:1.1rem;font-weight:bold;color:#333;',
          ref:    refStyle + 'padding-left:1.1rem;',
        };
    }
  }

  function buildHtml(quote, author, ref) {
    const s = buildInlineStyles();
    const quoteP     = `<p style="${s.text}">${formatQuote(quote)}</p>`;
    const authorLine = author ? `\n  <p style="${s.author}">— ${escapeHtml(author)}</p>` : '';
    const refLine    = ref    ? `\n  <p style="${s.ref}">${escapeHtml(ref)}</p>`        : '';

    if (currentStyle === 'speech') {
      return `<blockquote style="${s.blockquote}">\n  <div style="${s.bubble}">\n    ${quoteP}\n    ${s.tail}\n  </div>${authorLine}${refLine}\n</blockquote>`;
    }
    const openMark = s.openmark ? `\n  ${s.openmark}` : '';
    return `<blockquote style="${s.blockquote}">${openMark}\n  ${quoteP}${authorLine}${refLine}\n</blockquote>`;
  }

  /* ── Live preview (uses sample text until a quote is typed) ── */
  function readFields() {
    return {
      quote:  $('quote-text').value.trim(),
      author: $('quote-author').value.trim(),
      ref:    $('quote-ref').value.trim(),
    };
  }

  function update() {
    const f = readFields();
    const isSample = !f.quote;
    const html = isSample
      ? buildHtml(SAMPLE.quote, f.author || SAMPLE.author, '')
      : buildHtml(f.quote, f.author, f.ref);

    const preview = $('live-preview');
    preview.innerHTML = html;
    preview.classList.toggle('is-sample', isSample);
    $('sample-tag').hidden = !isSample;

    // If the settings have changed since the HTML was generated, flag it
    if (lastGenerated !== null) {
      const current = isSample ? null : buildHtml(f.quote, f.author, f.ref);
      const stale = current !== lastGenerated;
      $('html-output').classList.toggle('stale', stale);
      $('copy-btn').disabled = stale;
      setMsg(stale ? 'You’ve made changes — click Generate again to update the HTML.' : '', stale);
    }
  }

  function setMsg(text, warn) {
    const m = $('gen-msg');
    m.textContent = text;
    m.classList.toggle('warn', !!warn);
  }

  /* ── Generate ── */
  $('generate-btn').addEventListener('click', () => {
    const f = readFields();
    if (!f.quote) {
      setMsg('Add your quote text first, then generate the HTML.', true);
      $('quote-text').focus();
      return;
    }
    lastGenerated = buildHtml(f.quote, f.author, f.ref);
    $('html-output').value = lastGenerated;
    $('html-output').classList.remove('stale');
    $('copy-btn').disabled = false;
    setMsg(f.author ? 'HTML ready — copy it into an Ultra HTML block.' : 'HTML ready. Tip: you haven’t added an author.', false);
  });

  /* ── Copy ── */
  $('copy-btn').addEventListener('click', () => {
    const outputEl = $('html-output');
    const confirm  = $('copy-confirm');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(outputEl.value).then(() => showConfirm(confirm));
    } else {
      outputEl.select();
      outputEl.setSelectionRange(0, 99999);
      document.execCommand('copy');
      window.getSelection && window.getSelection().removeAllRanges();
      showConfirm(confirm);
    }
  });

  function showConfirm(el) {
    el.style.visibility = 'visible';
    setTimeout(() => el.style.visibility = 'hidden', 2500);
  }

  $('quote-text').addEventListener('input',   update);
  $('quote-author').addEventListener('input', update);
  $('quote-ref').addEventListener('input',    update);

  updateMiniPreviews();
  update();
</script>
</body>
</html>
